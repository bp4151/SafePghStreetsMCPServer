version: '3.8'

services:
  safepghstreets-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: safepghstreets-mcp-server
    ports:
      - "8000:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      PYTHONUNBUFFERED: 1
      # Uncomment to limit records ingested on startup for faster startup
      # WPRDC_INGEST_MAX_RECORDS: 5000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - safepghstreets-network

networks:
  safepghstreets-network:
    driver: bridge
